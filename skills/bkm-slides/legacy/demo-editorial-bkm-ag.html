<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BKM AG — Editorial Demo (Titelseite)</title>

  <!-- Google Fonts: Unbounded -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=swap" rel="stylesheet" />

  <style>
    /* ========================================
       BKM SLIDE — EDITORIAL DEMO
       Kontext: BKM AG (Titelseite)
       ======================================== */

    @font-face {
      font-family: 'TT Norms Pro';
      src: url('../../assets/fonts/TT_Norms_Pro_Compact_Regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'TT Norms Pro';
      src: url('../../assets/fonts/TT_Norms_Pro_Bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
    }

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    :root {
      --bg-dark: #1c4b42;
      --bg-light: #f5f0eb;
      --bg-card: #ffffff;
      --text-white: #ffffff;
      --text-muted: rgba(255,255,255,0.7);
      --text-dark: #1a1a1a;
      --text-grey: #494949;
      --accent-lime: #b4e717;
      --accent-pure-green: #4daf46;
      --card-border: #1c4b42;
      --footer-bg: #1c4b42;
    }

    .slide {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* ========================================
       TITELSEITE
       ======================================== */
    .slide--title {
      background: var(--bg-dark);
      display: flex;
      align-items: center;
    }

    /* Vertikale Lime-Akzentlinie */
    .accent-line {
      position: absolute;
      left: 7%;
      top: 20%;
      width: 4px;
      height: 60%;
      background: var(--accent-lime);
    }

    /* Logo */
    .logo {
      position: absolute;
      top: 5%;
      right: 5%;
      height: 36px;
      opacity: 0.9;
    }

    /* Content */
    .title-content {
      padding-left: 10%;
      max-width: 75%;
    }

    .title-content h1 {
      font-family: 'Unbounded', system-ui, sans-serif;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      color: var(--text-white);
      font-size: clamp(48px, 5.5vw, 88px);
      line-height: 1.0;
      letter-spacing: -0.04em;
    }

    .title-content .subtitle {
      font-family: 'TT Norms Pro', system-ui, sans-serif;
      font-weight: 400;
      font-style: italic;
      color: var(--text-muted);
      font-size: clamp(16px, 1.5vw, 20px);
      margin-top: 24px;
      max-width: 60%;
      line-height: 1.6;
    }

    .title-content .meta {
      margin-top: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .title-content .meta span {
      font-family: 'TT Norms Pro', system-ui, sans-serif;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent-lime);
    }

    .meta-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-lime);
    }
  </style>
</head>
<body>
  <div class="slide slide--title">
    <!-- Vertikale Lime-Akzentlinie -->
    <div class="accent-line"></div>

    <!-- Logo (Platzhalter — in Produktion: SVG-Asset) -->
    <svg class="logo" viewBox="0 0 200 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <text x="0" y="28" font-family="'Unbounded', sans-serif" font-weight="900" font-size="24" fill="#ffffff">BKM</text>
      <text x="70" y="28" font-family="'TT Norms Pro', sans-serif" font-weight="400" font-size="12" fill="rgba(255,255,255,0.6)">MANNESMANN</text>
    </svg>

    <!-- Content -->
    <div class="title-content">
      <h1>KI-Wissenszentrale<br/>für Fachbetriebe</h1>
      <p class="subtitle">
        Intelligente Unterstützung für Bauwerksabdichtung — von der Schadensanalyse bis zur Produktempfehlung.
      </p>
      <div class="meta">
        <div class="meta-dot"></div>
        <span>BKM Mannesmann AG • Mai 2026</span>
      </div>
    </div>
  </div>
</body>
</html>
