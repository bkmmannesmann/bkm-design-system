<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BKM AG — Demo Slide</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <style>
    /* ========================================
       BKM SLIDE SYSTEM — BKM AG PRESET
       ======================================== */

    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --slide-bg-dark: #1c4b42;
      --slide-bg-dark-alt: #2a6b5e;
      --slide-bg-light: #ffffff;
      --slide-bg-warm: #f6f5f2;

      --slide-text-on-dark: #ffffff;
      --slide-text-on-dark-muted: rgba(255,255,255,0.5);
      --slide-text-on-light: #1a1a1a;
      --slide-text-on-light-muted: #494949;

      --slide-accent: #b4e717;
      --slide-accent-on-dark: #b4e717;
      --slide-accent-on-light: #1c4b42;

      --slide-divider: rgba(255,255,255,0.15);

      --slide-radius-sm: 4px;
      --slide-radius-lg: 12px;

      --font-display: 'Unbounded', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'Geist Mono', monospace;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes dividerGrow {
      from { width: 0; opacity: 0; }
      to { width: 60px; opacity: 1; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes auroraShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes noiseShimmer {
      0% { background-position: 0 0; }
      100% { background-position: 256px 256px; }
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .animate-scale-in {
      animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }

    .animate-divider {
      animation: dividerGrow 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      width: 0;
    }

    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    .delay-3 { animation-delay: 0.3s; }
    .delay-4 { animation-delay: 0.4s; }
    .delay-5 { animation-delay: 0.5s; }
    .delay-6 { animation-delay: 0.6s; }
    .delay-7 { animation-delay: 0.7s; }

    /* Slide Container */
    .slide {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
    }

    .slide--aurora {
      background: linear-gradient(
        135deg,
        #1c4b42 0%,
        #2a6b5e 25%,
        #287d4b 50%,
        #1c4b42 75%,
        #2a6b5e 100%
      );
      background-size: 400% 400%;
      animation: auroraShift 12s ease-in-out infinite;
      color: var(--slide-text-on-dark);
    }

    /* Noise Overlay */
    .noise::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-repeat: repeat;
      background-size: 256px 256px;
      mix-blend-mode: overlay;
      animation: noiseShimmer 8s linear infinite;
    }

    /* Content */
    .slide__content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 5vh 5vw;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide__content--split {
      flex-direction: row;
      align-items: center;
      gap: 5vw;
    }

    .slide__half {
      flex: 1;
      min-width: 0;
    }

    /* Typography */
    .headline-xl {
      font-family: var(--font-display);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.04em;
      line-height: 1.0;
      font-size: clamp(48px, 6vw, 72px);
    }

    .headline-md {
      font-family: var(--font-display);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      line-height: 1.08;
      font-size: clamp(28px, 3.5vw, 44px);
    }

    .body-lg {
      font-family: var(--font-body);
      font-weight: 400;
      line-height: 1.7;
      font-size: clamp(16px, 1.5vw, 20px);
    }

    .label {
      font-family: var(--font-body);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: clamp(10px, 0.9vw, 13px);
    }

    .mono-lg {
      font-family: var(--font-mono);
      font-weight: 500;
      line-height: 1.0;
      font-size: clamp(32px, 4vw, 56px);
    }

    .mono-md {
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: clamp(14px, 1.2vw, 16px);
    }

    /* Divider */
    .divider {
      height: 3px;
      background-color: var(--slide-accent);
      border: none;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3vw;
    }

    .stat {
      display: flex;
      flex-direction: column;
      gap: 0.8vh;
    }

    .stat__value {
      color: var(--slide-accent);
    }

    .stat__label {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: clamp(12px, 1vw, 14px);
      opacity: 0.6;
    }

    /* Accent Bar */
    .accent-bar {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--slide-accent);
    }

    /* Footer */
    .slide__footer {
      position: absolute;
      bottom: 3vh;
      left: 5vw;
      right: 5vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
    }

    .slide__footer-text {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: clamp(10px, 0.8vw, 12px);
      opacity: 0.35;
    }

    .slide__page-number {
      font-family: var(--font-mono);
      font-weight: 500;
      font-size: clamp(10px, 0.8vw, 12px);
      opacity: 0.35;
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <div class="slide slide--aurora noise">
    <div class="slide__content slide__content--split">

      <!-- Left: Text Content -->
      <div class="slide__half">
        <span class="label animate-fade-in-up delay-1" style="color: var(--slide-text-on-dark-muted); display: block; margin-bottom: 2vh;">
          Bauwerksabdichtung seit 1928
        </span>

        <h1 class="headline-xl animate-fade-in-up delay-2" style="max-width: 90%;">
          SCHUTZ DER HÄLT
        </h1>

        <hr class="divider animate-divider delay-3" style="margin: 3vh 0;" />

        <p class="body-lg animate-fade-in-up delay-4" style="color: rgba(255,255,255,0.7); max-width: 85%;">
          Professionelle Bauwerksabdichtung mit MicroPorex® Technologie — gegen aufsteigende Feuchtigkeit und seitlich drückendes Wasser.
        </p>
      </div>

      <!-- Right: Stats -->
      <div class="slide__half">
        <div class="stats-grid">
          <div class="stat animate-scale-in delay-4">
            <span class="stat__value mono-lg">96</span>
            <span class="stat__label">Jahre Erfahrung</span>
          </div>
          <div class="stat animate-scale-in delay-5">
            <span class="stat__value mono-lg">500+</span>
            <span class="stat__label">Fachbetriebe</span>
          </div>
          <div class="stat animate-scale-in delay-6">
            <span class="stat__value mono-lg">2,5mm</span>
            <span class="stat__label">Schichtdicke</span>
          </div>
        </div>
      </div>

    </div>

    <!-- Footer -->
    <div class="slide__footer">
      <span class="slide__footer-text">BKM Mannesmann AG — Vertraulich</span>
      <span class="slide__page-number">01</span>
    </div>
  </div>
</body>
</html>
