<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>BKM Technical Drawing – A4 Landscape Template</title>
  <link rel="stylesheet" href="../tokens/technical-drawing.css">
  <style>
    @page { size: A4 landscape; margin: 0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bkm-sand-white); }
    svg { display: block; width: 297mm; height: 210mm; margin: auto; background: var(--td-paper); }
    @media screen { svg { max-width: 100%; height: auto; } }
  </style>
</head>
<body>
  <svg width="297mm" height="210mm" viewBox="0 0 297 210" role="img" aria-labelledby="title description">
    <title id="title">BKM Technical Drawing – Titel ersetzen</title>
    <desc id="description">Leere A4-Querformat-Vorlage mit semantischen Layern.</desc>
    <g data-layer="sheet"><rect width="297" height="210" fill="#fff"/><rect x="10" y="10" width="277" height="190" fill="none" stroke="#c8c5be" stroke-width=".25"/></g>
    <g data-layer="existing-masonry" id="existing-masonry"></g>
    <g data-layer="bkm-waterproofing" id="bkm-waterproofing"></g>
    <g data-layer="inspection" id="inspection"></g>
    <g data-layer="annotation" id="annotation"></g>
    <g data-layer="legend" id="legend"></g>
    <g data-layer="footer" id="footer"><text x="14" y="197" font-family="TT Norms Pro, Arial, sans-serif" font-size="2.25" fill="#494949">DRAFT · NOT_TO_SCALE · SCHEMATIC_LAYER_THICKNESS · NORMATIVE_VERIFICATION_REQUIRED</text></g>
  </svg>
</body>
</html>
