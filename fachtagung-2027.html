<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fachtagung 2027 — Planungstool</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1a3a5c;
    --primary-light: #2a5285;
    --accent: #0ea5e9;
    --accent-soft: #e0f2fe;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --bg: #f0f4f8;
    --surface: #ffffff;
    --surface2: #f8fafc;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-muted: #64748b;
    --sidebar-w: 280px;
    --header-h: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }

  /* Header */
  header {
    position: fixed; top: 0; left: 0; right: 0; height: var(--header-h);
    background: var(--primary); color: white; display: flex; align-items: center;
    padding: 0 24px; gap: 20px; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.2);
  }
  header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.02em; flex: 1; }
  header .badge { background: var(--accent); color: white; font-size: 0.7rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; }
  .progress-wrap { display: flex; align-items: center; gap: 10px; }
  .progress-bar { width: 180px; height: 8px; background: rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s ease; }
  .progress-pct { font-size: 0.8rem; font-weight: 600; min-width: 36px; }

  /* Layout */
  .layout { display: flex; margin-top: var(--header-h); min-height: calc(100vh - var(--header-h)); }

  /* Sidebar */
  aside {
    width: var(--sidebar-w); background: var(--primary); color: white;
    position: fixed; top: var(--header-h); left: 0; bottom: 0;
    overflow-y: auto; padding: 16px 0; z-index: 50;
  }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px; cursor: pointer; font-size: 0.82rem;
    transition: background 0.15s; border-left: 3px solid transparent;
    text-decoration: none; color: rgba(255,255,255,0.75);
  }
  .nav-item:hover { background: rgba(255,255,255,0.08); color: white; }
  .nav-item.active { background: rgba(14,165,233,0.2); border-left-color: var(--accent); color: white; }
  .nav-num { font-size: 0.7rem; font-weight: 700; background: rgba(255,255,255,0.15); border-radius: 4px; padding: 2px 6px; min-width: 26px; text-align: center; }
  .nav-progress { margin-left: auto; font-size: 0.7rem; color: rgba(255,255,255,0.5); }
  .nav-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.2); flex-shrink: 0; }
  .nav-dot.done { background: var(--success); }
  .nav-dot.partial { background: var(--warning); }

  /* Main */
  main { margin-left: var(--sidebar-w); flex: 1; padding: 32px 40px; max-width: 1100px; }

  /* Section */
  .section { margin-bottom: 40px; background: var(--surface); border-radius: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); overflow: hidden; }
  .section-header {
    display: flex; align-items: center; gap: 14px;
    padding: 20px 24px; background: var(--surface2); border-bottom: 1px solid var(--border);
    cursor: pointer; user-select: none;
  }
  .section-header:hover { background: var(--accent-soft); }
  .section-num { background: var(--primary); color: white; font-weight: 700; font-size: 0.8rem; width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .section-title { font-size: 1rem; font-weight: 600; flex: 1; }
  .section-progress-mini { font-size: 0.75rem; color: var(--text-muted); }
  .chevron { transition: transform 0.2s; font-size: 1rem; color: var(--text-muted); }
  .section.collapsed .chevron { transform: rotate(-90deg); }
  .section-body { padding: 24px; display: block; }
  .section.collapsed .section-body { display: none; }

  /* Subsection */
  .subsection { margin-bottom: 20px; }
  .subsection-title { font-size: 0.85rem; font-weight: 600; color: var(--primary-light); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }

  /* Items grid */
  .items-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 8px; }
  .check-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface2); border-radius: 8px; border: 1px solid var(--border); transition: border-color 0.15s; }
  .check-item:hover { border-color: var(--accent); }
  .check-item input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; flex-shrink: 0; }
  .check-item label { font-size: 0.85rem; cursor: pointer; flex: 1; }
  .check-item.checked { background: #f0fdf4; border-color: var(--success); }
  .check-item.checked label { color: var(--success); text-decoration: line-through; text-decoration-color: var(--success); }

  /* Form fields */
  .field-group { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); }
  .field input, .field textarea, .field select {
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
    font-size: 0.88rem; font-family: inherit; background: var(--surface2);
    color: var(--text); transition: border-color 0.15s;
    width: 100%;
  }
  .field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--accent); background: white; }
  .field textarea { resize: vertical; min-height: 80px; }
  .fields-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

  /* Message boxes */
  .cta-box { background: var(--accent-soft); border: 1px solid #bae6fd; border-radius: 10px; padding: 16px; margin-top: 8px; }
  .cta-box .field textarea { background: white; }

  /* Speaker cards */
  .speaker-list { display: flex; flex-direction: column; gap: 16px; }
  .speaker-card { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .speaker-card-header { background: var(--surface2); padding: 12px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .speaker-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; }
  .speaker-name { font-weight: 600; font-size: 0.9rem; flex: 1; }
  .speaker-type { font-size: 0.72rem; color: white; background: var(--accent); padding: 2px 8px; border-radius: 12px; }
  .speaker-body { padding: 16px; display: none; }
  .speaker-card.open .speaker-body { display: block; }
  .btn { padding: 9px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { opacity: 0.85; }
  .btn-danger { background: var(--danger); color: white; font-size: 0.78rem; padding: 6px 12px; }
  .btn-outline { background: white; color: var(--primary); border: 1px solid var(--border); }
  .btn-outline:hover { border-color: var(--accent); }

  /* Budget table */
  .budget-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  .budget-table th { background: var(--primary); color: white; padding: 10px 14px; text-align: left; font-weight: 600; }
  .budget-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); }
  .budget-table tr:last-child td { border-bottom: none; }
  .budget-table tr:hover td { background: var(--surface2); }
  .budget-table .total-row td { font-weight: 700; background: var(--accent-soft); border-top: 2px solid var(--accent); }
  .budget-table input { border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; width: 120px; font-size: 0.85rem; font-family: inherit; text-align: right; }
  .budget-table input:focus { outline: none; border-color: var(--accent); }
  .diff-pos { color: var(--success); font-weight: 600; }
  .diff-neg { color: var(--danger); font-weight: 600; }

  /* Timeline */
  .timeline { position: relative; }
  .timeline::before { content: ''; position: absolute; left: 90px; top: 0; bottom: 0; width: 2px; background: var(--border); }
  .tl-item { display: flex; gap: 20px; margin-bottom: 12px; align-items: flex-start; }
  .tl-time { width: 80px; text-align: right; font-size: 0.82rem; font-weight: 600; color: var(--accent); padding-top: 8px; flex-shrink: 0; }
  .tl-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); border: 2px solid white; box-shadow: 0 0 0 2px var(--accent); flex-shrink: 0; margin-top: 10px; position: relative; z-index: 1; }
  .tl-content { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .tl-content input { border: none; background: transparent; font-size: 0.88rem; font-weight: 500; width: 100%; font-family: inherit; color: var(--text); }
  .tl-content input:focus { outline: none; }
  .tl-content textarea { border: none; background: transparent; font-size: 0.8rem; color: var(--text-muted); width: 100%; resize: none; font-family: inherit; margin-top: 4px; }
  .tl-content textarea:focus { outline: none; }

  /* Risiken */
  .risk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .risk-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .risk-card .risk-title { font-weight: 600; font-size: 0.88rem; margin-bottom: 8px; }
  .risk-card select { width: 100%; margin-bottom: 8px; }

  /* KPI */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .kpi-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; text-align: center; }
  .kpi-card label { font-size: 0.78rem; color: var(--text-muted); font-weight: 500; display: block; margin-bottom: 6px; }
  .kpi-card input { border: none; background: transparent; font-size: 1.5rem; font-weight: 700; color: var(--primary); text-align: center; width: 100%; font-family: inherit; }
  .kpi-card input:focus { outline: none; color: var(--accent); }
  .kpi-unit { font-size: 0.75rem; color: var(--text-muted); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; margin-bottom: 20px; }
  .tab { padding: 8px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); }
  .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Dramaturgie */
  .dramatik-grid { display: flex; flex-direction: column; gap: 12px; }
  .dramatik-item { display: flex; gap: 14px; align-items: flex-start; }
  .dramatik-num { background: var(--accent); color: white; border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
  .dramatik-content { flex: 1; }

  /* Print */
  @media print {
    aside, header .progress-wrap { display: none; }
    main { margin-left: 0; }
    .section.collapsed .section-body { display: block !important; }
    .section-header { background: none; }
    .section { box-shadow: none; border: 1px solid #ccc; }
    .btn { display: none; }
  }

  @media (max-width: 900px) {
    aside { display: none; }
    main { margin-left: 0; padding: 20px; }
  }

  .divider { height: 1px; background: var(--border); margin: 20px 0; }
  .tag { display: inline-block; background: var(--accent-soft); color: var(--accent); font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 12px; }
  .mt12 { margin-top: 12px; }
  .mt20 { margin-top: 20px; }
  .flex-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .saved-indicator { font-size: 0.75rem; color: var(--success); opacity: 0; transition: opacity 0.5s; }
  .saved-indicator.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>📋 Fachtagung 2027 — Planungstool</h1>
  <div class="progress-wrap">
    <span id="savedIndicator" class="saved-indicator">✓ Gespeichert</span>
    <div class="progress-bar"><div class="progress-fill" id="globalProgress" style="width:0%"></div></div>
    <span class="progress-pct" id="globalPct">0%</span>
    <span class="badge">2027</span>
  </div>
</header>

<div class="layout">
<aside id="sidebar"></aside>
<main id="main"></main>
</div>

<script>
// ─── Data structure ───────────────────────────────────────────────────────────
const SECTIONS = [
  {
    id: 's1', num: 1, title: 'Strategie & Ziele',
    render: () => `
      <div class="subsection">
        <div class="subsection-title">Anlass & Vision</div>
        <div class="fields-grid">
          <div class="field"><label>Anlass der Fachtagung</label><textarea data-key="s1_anlass" placeholder="Warum findet die Fachtagung statt?"></textarea></div>
          <div class="field"><label>Vision / Leitmotiv</label><textarea data-key="s1_vision" placeholder="Das übergeordnete Thema oder Motto..."></textarea></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="subsection">
        <div class="subsection-title">Business-Ziele</div>
        <div class="items-grid">
          ${checkbox('s1_bz1','Wissen vermitteln')}
          ${checkbox('s1_bz2','Strategie kommunizieren')}
          ${checkbox('s1_bz3','Veränderung begleiten')}
          ${checkbox('s1_bz4','Vernetzung fördern')}
          ${checkbox('s1_bz5','Kultur stärken')}
        </div>
      </div>
      <div class="divider"></div>
      <div class="subsection">
        <div class="subsection-title">Gewünschte Wirkung</div>
        <div class="fields-grid">
          <div class="field"><label>🧠 Denken — Was sollen Teilnehmer anders denken?</label><textarea data-key="s1_denken" placeholder="..."></textarea></div>
          <div class="field"><label>❤️ Fühlen — Was sollen Teilnehmer fühlen?</label><textarea data-key="s1_fuehlen" placeholder="..."></textarea></div>
          <div class="field"><label>📚 Wissen — Was sollen Teilnehmer wissen?</label><textarea data-key="s1_wissen" placeholder="..."></textarea></div>
          <div class="field"><label>🚀 Handeln — Was sollen Teilnehmer tun?</label><textarea data-key="s1_handeln" placeholder="..."></textarea></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="subsection">
        <div class="subsection-title">Erfolgskriterien</div>
        <div class="fields-grid">
          <div class="field"><label>Teilnehmerzufriedenheit (Zielwert, z.B. NPS > 40)</label><input type="text" data-key="s1_ec1" placeholder="Zielwert..."></div>
          <div class="field"><label>Wissenstransfer (Messmethode)</label><input type="text" data-key="s1_ec2" placeholder="z.B. Pre/Post Quiz..."></div>
          <div class="field"><label>Umsetzung (Maßnahmen nach Event)</label><input type="text" data-key="s1_ec3" placeholder="..."></div>
          <div class="field"><label>Impact (Langfristige Wirkung)</label><input type="text" data-key="s1_ec4" placeholder="..."></div>
        </div>
      </div>`
  },
  {
    id: 's2', num: 2, title: 'Teilnehmer',
    render: () => `
      <div class="subsection">
        <div class="subsection-title">Zielgruppen</div>
        <div class="items-grid">
          ${checkbox('s2_zg1','Führungskräfte')}
          ${checkbox('s2_zg2','Experten')}
          ${checkbox('s2_zg3','Mitarbeitende')}
          ${checkbox('s2_zg4','Neue Mitarbeitende')}
          ${checkbox('s2_zg5','Externe Gäste')}
        </div>
        <div class="fields-grid mt12">
          <div class="field"><label>Erwartete Teilnehmerzahl</label><input type="number" data-key="s2_anzahl" placeholder="z.B. 250"></div>
          <div class="field"><label>Besonderheiten / Hinweise</label><input type="text" data-key="s2_hinweise" placeholder="..."></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="subsection">
        <div class="subsection-title">Teilnehmermanagement</div>
        <div class="items-grid">
          ${checkbox('s2_tm1','Einladungen')}
          ${checkbox('s2_tm2','Registrierung')}
          ${checkbox('s2_tm3','Teilnehmerliste')}
          ${checkbox('s2_tm4','Check-in')}
          ${checkbox('s2_tm5','Namensschilder')}
        </div>
        <div class="fields-grid mt12">
          <div class="field"><label>Registrierungsplattform / -tool</label><input type="text" data-key="s2_tool" placeholder="z.B. Eventbrite, intern..."></div>
          <div class="field"><label>Registrierungsdeadline</label><input type="date" data-key="s2_deadline"></div>
        </div>
      </div>
      <div class="divider"></div>
      <div class="subsection">
        <div class="subsection-title">Teilnehmerreise</div>
        <div class="fields-grid">
          <div class="field"><label>Vor dem Event (Kommunikation, Info-Paket)</label><textarea data-key="s2_pre" placeholder="Was bekommen Teilnehmer vorab?"></textarea></div>
          <div class="field"><label>Anreise (Infos, Shuttle, Parkplätze)</label><textarea data-key="s2_anreise" placeholder="..."></textarea></div>
          <div class="field"><label>Aufenthalt (Hotel-Empfehlungen, Besonderheiten)</label><textarea data-key="s2_aufenthalt" placeholder="..."></textarea></div>
          <div class="field"><label>Nachbereitung (Follow-up, Materialien)</label><textarea data-key="s2_nachbe" placeholder="..."></textarea></div>
        </div>
      </div>`
  },
  {
    id: 's3', num: 3, title: 'Kernbotschaften',
    render: () => `
      <div class="subsection">
        <div class="subsection-title">Hauptbotschaften</div>
        <div class="field-group">
          ${['1','2','3','4'].map(n => `<div class="field"><label>Hauptbotschaft ${n}</label><textarea data-key="s3_hb${n}" placeholder="Botschaft ${n}..."></textarea></div>`).join('')}
        </div>
      </div>
      <div class="divider"></div>
      <div class="cta-box">
        <div class="subsection-title">Call to Action</div>
        <div class="field"><label>Was sollen Teilnehmer nach der Tagung konkret tun?</label><textarea data-key="s3_cta" placeholder="Der eine klare Aufruf zum Handeln..."></textarea></div>
      </div>`
  },
  {
    id: 's4', num: 4, title: 'Inhalte & Themen',
    render: () => `
      <div class="subsection">
        <div class="subsection-title">Themenfelder</div>
        <div class="fields-grid">
          ${['A — Markt & Zukunft','B — Strategie','C — Praxis','D — Innovation','E — Change / Kultur'].map((t,i) => `
            <div class="field"><label>Themenfeld ${t}</label><textarea data-key="s4_tf${i}" placeholder="Konkrete Inhalte, Fragen, Fokus..."></textarea></div>

      </div>
      <div class="divider"></div>
      <div class="subsection">
        <div class="subsection-title">Formate (geplante Nutzung)</div>
        <div class="items-grid">
          ${['Keynotes','Fachvorträge','Workshops','Panels','Fireside Chats','Q&A'].map((f,i) => checkbox(`s4_f${i}`,f)).join('')}
        </div>
      </div>`
  },
  {
    id: 's5', num: 5, title: 'Speaker',
    render: () => `
      <div class="flex-row" style="margin-bottom:16px">
        <button class="btn btn-primary" onclick="addSpeaker()">+ Speaker hinzufügen</button>
        <span style="font-size:0.8rem;color:var(--text-muted)">Klick auf Speaker-Karte zum Bearbeiten</span>
      </div>
      <div class="speaker-list" id="speakerList"></div>`
  },
  {
    id: 's6', num: 6, title: 'Dramaturgie',
    render: () => `
      <div class="subsection">
        <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:16px">Beschreiben Sie den dramaturgischen Bogen der Tagung — von der Ausgangslage bis zum Handlungsaufruf.</p>
        <div class="dramatik-grid">
          ${[
            ['1','Wo stehen wir?'],['2','Warum Veränderung?'],['3','Zukunftsbild'],
            ['4','Konkrete Umsetzung'],['5','Nächste Schritte']
          ].map(([n,t]) => `
            <div class="dramatik-item">
              <div class="dramatik-num">${n}</div>
              <div class="dramatik-content">
                <div style="font-weight:600;font-size:0.88rem;margin-bottom:6px">${t}</div>
                <div class="field"><textarea data-key="s6_k${n}" placeholder="Inhalt, Botschaft, Format..."></textarea></div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>`
  },
  {
    id: 's7', num: 7, title: 'Agenda & Ablauf',
    render: () => `
      <div class="tabs">
        <div class="tab active" onclick="switchTab('agenda','tag1')">Tag 1</div>
        <div class="tab" onclick="switchTab('agenda','tag2')">Tag 2</div>
        <div class="tab" onclick="switchTab('agenda','energie')">Energiekurve</div>
      </div>
      <div id="agenda-tag1" class="tab-content active">${renderTimeline('s7_t1', [
        {time:'08:30',label:'Registrierung & Welcome Coffee'},
        {time:'09:00',label:'Eröffnung'},
        {time:'09:30',label:'Keynote 1'},
        {time:'10:30',label:'Pause'},
        {time:'11:00',label:'Keynote 2'},
        {time:'12:00',label:'Mittagspause'},
        {time:'13:00',label:'Workshop-Runde 1'},
        {time:'14:30',label:'Session A'},
        {time:'15:30',label:'Kaffeepause'},
        {time:'16:00',label:'Session B'},
        {time:'17:00',label:'Networking'},
        {time:'19:00',label:'Abendprogramm'},
      ])}</div>
      <div id="agenda-tag2" class="tab-content">${renderTimeline('s7_t2', [
        {time:'08:30',label:'Recap & Morning Briefing'},
        {time:'09:00',label:'Fachsession 1'},

// ─── Helpers ──────────────────────────────────────────────────────────────────
function checkbox(key, label) {
  return `<div class="check-item" id="ci_${key}">
    <input type="checkbox" id="cb_${key}" data-key="${key}" onchange="onCheck('${key}',this)">
    <label for="cb_${key}">${label}</label>
  </div>`;
}

function renderTimeline(prefix, items) {
  return `<div class="timeline">${items.map((item,i) => `
    <div class="tl-item">
      <div class="tl-time">${item.time}</div>
      <div class="tl-dot"></div>
      <div class="tl-content">
        <input type="text" data-key="${prefix}_label${i}" value="${item.label}">
        <textarea data-key="${prefix}_note${i}" placeholder="Notizen, Verantwortliche, Technik..." rows="1"></textarea>
      </div>
    </div>`).join('')}</div>`;
}

function renderRegieRows() {
  const rows = load('s16_rows') || [
    {time:'08:30',prog:'Einlass / Registrierung',verantw:'',tech:'',cue:'',backup:''},
    {time:'09:00',prog:'Eröffnung',verantw:'',tech:'',cue:'Moderation',backup:''},
  ];
  return rows.map((r,i) => regieRow(r,i)).join('');
}

function regieRow(r, i) {
  return `<tr id="regie_${i}">
    <td><input type="text" value="${r.time||''}" oninput="saveRegieRow(${i},'time',this.value)" style="width:70px"></td>
    <td><input type="text" value="${r.prog||''}" oninput="saveRegieRow(${i},'prog',this.value)" style="width:180px"></td>
    <td><input type="text" value="${r.verantw||''}" oninput="saveRegieRow(${i},'verantw',this.value)" style="width:130px"></td>
    <td><input type="text" value="${r.tech||''}" oninput="saveRegieRow(${i},'tech',this.value)" style="width:120px"></td>

    <td><input type="text" value="${r.backup||''}" oninput="saveRegieRow(${i},'backup',this.value)" style="width:130px"></td>

}

// ─── Storage ─────────────────────────────────────────────────────────────────
function save(key, val) { try { localStorage.setItem('ft27_'+key, JSON.stringify(val)); } catch(e){} }
function load(key) { try { const v = localStorage.getItem('ft27_'+key); return v ? JSON.parse(v) : null; } catch(e){ return null; } }

function saveField(key, val) { save(key, val); showSaved(); updateProgress(); }
function showSaved() {
  const el = document.getElementById('savedIndicator');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 2000);
}

function deleteSpeaker(i) { if(confirm('Speaker wirklich entfernen?')) { speakers.splice(i,1); saveSpeakers(); renderSpeakers(); } }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── Budget ───────────────────────────────────────────────────────────────────
function updateBudget() {
  let totalP = 0, totalA = 0;
  for(let i=0;i<8;i++) {
    const pi = document.querySelector(`[data-key="s14_p${i}"]`);
    const ai = document.querySelector(`[data-key="s14_a${i}"]`);
    const p = parseFloat(pi?.value||0)||0;
    const a = parseFloat(ai?.value||0)||0;
    totalP += p; totalA += a;
    const diff = p - a;
    const el = document.getElementById(`s14_diff${i}`);
    if(el) { el.textContent = diff===0?'—':(diff>0?'+':'')+diff.toLocaleString('de-DE')+'€'; el.className = diff>=0?'diff-pos':'diff-neg'; }
    if(pi) saveField(`s14_p${i}`, pi.value);
    if(ai) saveField(`s14_a${i}`, ai.value);
  }
  const el = document.getElementById('s14_totalP'); if(el) el.textContent=totalP.toLocaleString('de-DE')+'€';
  const ea = document.getElementById('s14_totalA'); if(ea) ea.textContent=totalA.toLocaleString('de-DE')+'€';
  const ed = document.getElementById('s14_totalDiff');
  if(ed) { const d=totalP-totalA; ed.textContent=(d>=0?'+':'')+d.toLocaleString('de-DE')+'€'; ed.className=d>=0?'diff-pos':'diff-neg'; }
}

  save('s16_rows', regieRows);
  const tbody = document.getElementById('regieTbody');
  if(tbody) tbody.innerHTML = regieRows.map((r,i)=>regieRow(r,i)).join('');
}
function saveRegieRow(i, field, val) { regieRows[i][field]=val; save('s16_rows',regieRows); showSaved(); }

// ─── Tabs ─────────────────────────────────────────────────────────────────────
function switchTab(group, tab) {
  document.querySelectorAll(`[id^="${group}-"]`).forEach(el => el.classList.remove('active'));
  document.getElementById(`${group}-${tab}`)?.classList.add('active');
  const tabs = document.querySelectorAll(`.tab`);
  tabs.forEach(t => {
    if(t.getAttribute('onclick')===`switchTab('${group}','${tab}')`) t.classList.add('active');
    else if(t.getAttribute('onclick')?.startsWith(`switchTab('${group}'`)) t.classList.remove('active');
  });
}

// ─── Checkboxes ───────────────────────────────────────────────────────────────
function onCheck(key, el) {
  saveField(key, el.checked);
  const ci = document.getElementById('ci_'+key);
  if(ci) ci.classList.toggle('checked', el.checked);
}

// ─── Progress ─────────────────────────────────────────────────────────────────
function updateProgress() {
  const checkboxes = document.querySelectorAll('input[type=checkbox][data-key]');
  const total = checkboxes.length;
  const checked = Array.from(checkboxes).filter(c=>c.checked).length;
  const pct = total ? Math.round(checked/total*100) : 0;
  document.getElementById('globalProgress').style.width = pct+'%';
  document.getElementById('globalPct').textContent = pct+'%';

  SECTIONS.forEach(sec => {
    const cbs = document.querySelectorAll(`#${sec.id} input[type=checkbox]`);
    const tot = cbs.length;
    const chk = Array.from(cbs).filter(c=>c.checked).length;
    const dot = document.getElementById('dot_'+sec.id);
    if(dot) {
      dot.className = 'nav-dot' + (chk===0?'':(chk===tot?' done':' partial'));
    }
    const pctEl = document.getElementById('navpct_'+sec.id);
    if(pctEl) pctEl.textContent = tot?`${chk}/${tot}`:'';
  });
}

// ─── Render ───────────────────────────────────────────────────────────────────
function buildUI() {
  const sidebar = document.getElementById('sidebar');
  const main = document.getElementById('main');

  sidebar.innerHTML = SECTIONS.map(s => `
    <a class="nav-item" href="#${s.id}" id="nav_${s.id}">
      <span class="nav-num">${s.num}</span>
      <span style="flex:1">${s.title}</span>
      <span class="nav-dot" id="dot_${s.id}"></span>
      <span class="nav-progress" id="navpct_${s.id}"></span>
    </a>`).join('');

  main.innerHTML = SECTIONS.map(s => `
    <div class="section" id="${s.id}">
      <div class="section-header" onclick="toggleSection('${s.id}')">
        <div class="section-num">${s.num}</div>
        <div class="section-title">${s.title}</div>
        <span class="section-progress-mini" id="sp_${s.id}"></span>
        <span class="chevron">▼</span>
      </div>
      <div class="section-body">${s.render()}</div>
    </div>`).join('');

  loadAllValues();
  renderSpeakers();
  updateBudget();
  updateProgress();

  // Active nav on scroll
  const observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting) {
        document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
        document.getElementById('nav_'+e.target.id)?.classList.add('active');
      }
    });
  }, {rootMargin:'-20% 0px -70% 0px'});
  SECTIONS.forEach(s => { const el = document.getElementById(s.id); if(el) observer.observe(el); });

  // Wire up generic inputs
  document.addEventListener('input', e => {
    const key = e.target.dataset.key;
    if(key && e.target.type !== 'checkbox') saveField(key, e.target.value);
  });
  document.addEventListener('change', e => {
    const key = e.target.dataset.key;
    if(key && e.target.tagName==='SELECT') saveField(key, e.target.value);
  });
}

function toggleSection(id) {
  document.getElementById(id)?.classList.toggle('collapsed');
}

function loadAllValues() {
  document.querySelectorAll('[data-key]').forEach(el => {
    const val = load(el.dataset.key);
    if(val === null) return;
    if(el.type === 'checkbox') {
      el.checked = val;
      const ci = document.getElementById('ci_'+el.dataset.key);
      if(ci) ci.classList.toggle('checked', val);
    } else {
      el.value = val;
    }
  });
}

document.addEventListener('DOMContentLoaded', buildUI);
</script>
</body>
